services:
  - type: web
    name: planora-study
    env: python
    buildCommand: ./build.sh
    startCommand: gunicorn studytracker.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.2
      - key: DJANGO_SETTINGS_MODULE
        value: studytracker.settings
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: planora-db
          property: connectionString

databases:
  - name: planora-db
    plan: free

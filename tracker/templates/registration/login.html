<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Planora</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Caveat:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #fdf2f5;
            --text-dark: #584a69;
            --text-muted: #9487a3;
            --accent-purple: #b8a8d8;
            --accent-pink: #f7d7d2;
            --card-bg: #ffffff;
            --accent-light: #f3e8ff;
            --accent-peach: #fce8e4;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(var(--accent-pink) 0.5px, transparent 0.5px);
            background-size: 24px 24px;
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 1.5rem;
            overflow: hidden;
        }

        /* Splash Screen */
        .splash-screen {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: var(--bg-color);
            background-image: radial-gradient(var(--accent-pink) 0.5px, transparent 0.5px);
            background-size: 24px 24px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.8s;
        }
        
        .splash-text {
            font-size: 6rem;
            font-family: 'Caveat', cursive;
            font-weight: 700;
            color: var(--accent-purple);
            animation: float-splash 3s ease-in-out infinite;
            margin-bottom: 2rem;
            text-shadow: 0 10px 20px rgba(184, 168, 216, 0.2);
        }

        @keyframes float-splash {
            0%, 100% { transform: translateY(0) rotate(-2deg); }
            50% { transform: translateY(-20px) rotate(2deg); }
        }

        @keyframes fadeIn {
            to { opacity: 1; transform: scale(1); }
        }

        /* Card */
        .card {
            background: #fffafb;
            border-radius: 40px;
            padding: 3.5rem;
            box-shadow: 0 20px 50px rgba(88, 74, 105, 0.1);
            width: 100%;
            max-width: 450px;
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
            text-align: center;
            border: 4px solid var(--accent-light);
            position: relative;
        }

        .card::before {
            content: '✨';
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 1.5rem;
            opacity: 0.4;
        }

        body.loaded .splash-screen {
            opacity: 0;
            visibility: hidden;
        }
        body.loaded .card {
            opacity: 1;
            transform: translateY(0);
        }

        .header-title {
            font-size: 3rem;
            font-family: 'Caveat', cursive;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: var(--text-dark);
        }
        
        .header-subtitle {
            font-size: 1.1rem;
            color: var(--text-muted);
            margin-bottom: 2.5rem;
            font-style: italic;
        }

        .app-form-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }

        .app-form-group label {
            display: block;
            font-size: 1rem;
            color: var(--text-dark);
            margin-bottom: 0.5rem;
            font-weight: 600;
        }

        .app-form-control {
            width: 100%;
            padding: 1rem 1.2rem;
            background: #ffffff;
            border: 2px solid var(--accent-light);
            border-radius: 15px;
            color: var(--text-dark);
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .app-form-control:focus {
            border-color: var(--accent-purple);
            box-shadow: 0 0 0 4px rgba(184, 168, 216, 0.1);
        }

        .app-btn-primary {
            width: 100%;
            padding: 1rem;
            background: var(--accent-purple);
            color: white;
            border: none;
            border-radius: 18px;
            font-size: 1.6rem;
            font-family: 'Caveat', cursive;
            font-weight: 700;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
            box-shadow: 0 8px 15px rgba(184, 168, 216, 0.3);
            margin-top: 1rem;
        }

        .app-btn-primary:hover { 
            box-shadow: 0 12px 25px rgba(184, 168, 216, 0.4); 
            transform: translateY(-3px) scale(1.02); 
            background: #a898c8;
        }

        .splash-btn {
            width: auto;
            padding: 0.8rem 3rem;
            border-radius: 50px;
            opacity: 0;
            transform: scale(0.8);
            animation: fadeIn 0.8s ease-out 1s forwards;
            font-size: 1.8rem;
        }
        
        .error-msg {
            color: #ef4444;
            font-size: 0.95rem;
            margin-bottom: 2rem;
            background: #fef2f2;
            padding: 1rem;
            border-radius: 15px;
            border: 2px dashed #fecaca;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <!-- Splash Screen -->
    <div class="splash-screen" id="splash">
        <h1 class="splash-text">Planora</h1>
        <button id="enterLoginBtn" class="app-btn-primary splash-btn">
            Enter <i class="fas fa-arrow-right" style="margin-left: 0.5rem;"></i>
        </button>
    </div>

    <!-- Login Form -->
    <div class="card">
        <h2 class="header-title">Welcome Back</h2>
        <p class="header-subtitle">Login to continue to Planora</p>
        
        {% if form.errors %}
            <div class="error-msg">Your username and password didn't match. Please try again.</div>
        {% endif %}

        <form method="post" action="{% url 'login' %}">
            {% csrf_token %}
            <div class="app-form-group">
                <label>Username</label>
                <input type="text" name="username" class="app-form-control" placeholder="Enter username" required autofocus>
            </div>
            
            <div class="app-form-group">
                <label>Password</label>
                <input type="password" name="password" class="app-form-control" placeholder="Enter password" required>
            </div>

            <button type="submit" class="app-btn-primary">Log In</button>
            <input type="hidden" name="next" value="{{ next|default:'/' }}">
        </form>
    </div>

    <script>
        document.getElementById('enterLoginBtn').addEventListener('click', () => {
            document.body.classList.add('loaded');
        });
    </script>
</body>
</html>

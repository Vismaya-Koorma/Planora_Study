<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Planora</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #fcf4f6;
            --text-dark: #584a69;
            --text-muted: #9487a3;
            --accent-blue: #7c5c96;
            --card-bg: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 1.5rem;
            overflow: hidden;
        }

        /* Splash Screen */
        .splash-screen {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: var(--bg-color);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.8s ease-out, visibility 0.8s;
        }
        
        .splash-text {
            font-size: 3.5rem;
            font-weight: 700;
            color: var(--accent-blue);
            animation: float-splash 3s ease-in-out infinite;
            margin-bottom: 2rem;
        }

        @keyframes float-splash {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        @keyframes fadeIn {
            to { opacity: 1; transform: scale(1); }
        }

        /* Glass Panel / Card */
        .card {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 3rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 400px;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.8s ease-out 0.3s;
            text-align: center;
        }

        body.loaded .splash-screen {
            opacity: 0;
            visibility: hidden;
        }
        body.loaded .card {
            opacity: 1;
            transform: translateY(0);
        }

        .header-title {
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: #0f172a;
        }
        
        .header-subtitle {
            font-size: 1rem;
            color: var(--text-muted);
            margin-bottom: 2rem;
        }

        .app-form-group {
            margin-bottom: 1.25rem;
            text-align: left;
        }

        .app-form-group label {
            display: block;
            font-size: 0.875rem;
            color: var(--text-dark);
            margin-bottom: 0.5rem;
            font-weight: 500;
        }

        .app-form-control {
            width: 100%;
            padding: 0.875rem 1rem;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            color: var(--text-dark);
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .app-form-control:focus {
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .app-btn-primary {
            width: 100%;
            padding: 1rem;
            background: var(--accent-blue);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            transition: all 0.2s;
            cursor: pointer;
            box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.2);
            margin-top: 1rem;
        }

        .app-btn-primary:active { transform: scale(0.98); }
        .app-btn-primary:hover { box-shadow: 0 10px 15px -3px rgba(37, 99, 235, 0.3); transform: translateY(-2px); }

        .splash-btn {
            width: auto;
            padding: 1rem 3rem;
            border-radius: 50px;
            opacity: 0;
            animation: fadeIn 0.8s ease-out 1s forwards;
        }
        
        .error-msg {
            color: #ef4444;
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
            background: #fef2f2;
            padding: 0.75rem;
            border-radius: 8px;
            border: 1px solid #fee2e2;
        }
    </style>
</head>
<body>

    <!-- Splash Screen -->
    <div class="splash-screen" id="splash">
        <h1 class="splash-text">Planora</h1>
        <button id="enterLoginBtn" class="app-btn-primary splash-btn">
            Enter <i class="fas fa-arrow-right" style="margin-left: 0.5rem;"></i>
        </button>
    </div>

    <!-- Login Form -->
    <div class="card">
        <h2 class="header-title">Welcome Back</h2>
        <p class="header-subtitle">Login to continue to Planora</p>
        
        {% if form.errors %}
            <div class="error-msg">Your username and password didn't match. Please try again.</div>
        {% endif %}

        <form method="post" action="{% url 'login' %}">
            {% csrf_token %}
            <div class="app-form-group">
                <label>Username</label>
                <input type="text" name="username" class="app-form-control" placeholder="Enter username" required autofocus>
            </div>
            
            <div class="app-form-group">
                <label>Password</label>
                <input type="password" name="password" class="app-form-control" placeholder="Enter password" required>
            </div>

            <button type="submit" class="app-btn-primary">Log In</button>
            <input type="hidden" name="next" value="{{ next|default:'/' }}">
        </form>
    </div>

    <script>
        document.getElementById('enterLoginBtn').addEventListener('click', () => {
            document.body.classList.add('loaded');
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Study Planner</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-bg: #0f172a;
            --accent: #3b82f6;
            --text-main: #f8fafc;
        }
        body {
            background-color: var(--primary-bg);
            background-image: radial-gradient(circle at top right, #1e1b4b, transparent 40%),
                              radial-gradient(circle at bottom left, #064e3b, transparent 40%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Outfit', sans-serif;
            margin: 0;
            overflow: hidden;
        }

        /* Splash Screen */
        .splash-screen {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: var(--primary-bg);
            background-image: radial-gradient(circle at top right, #1e1b4b, transparent 40%),
                              radial-gradient(circle at bottom left, #064e3b, transparent 40%);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.8s ease-out, visibility 0.8s;
        }
        
        .splash-text {
            font-size: 3rem;
            font-weight: 700;
            background: linear-gradient(135deg, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: float-splash 3s ease-in-out infinite;
        }

        @keyframes float-splash {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        @keyframes fadeIn {
            to { opacity: 1; transform: scale(1); }
        }

        /* Glass Panel */
        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 24px;
            padding: 3rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 450px;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.8s ease-out 0.3s;
        }

        body.loaded .splash-screen {
            opacity: 0;
            visibility: hidden;
        }
        body.loaded .glass-panel {
            opacity: 1;
            transform: translateY(0);
        }

        .app-form-control {
            width: 100%;
            padding: 0.875rem 1rem;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: white;
            font-size: 1rem;
            margin-bottom: 1.5rem;
            outline: none;
        }
        .app-form-control:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.5);
        }
        .app-btn-primary {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, var(--accent), #6366f1);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            transition: transform 0.2s;
        }
        .app-btn-primary:active { transform: scale(0.95); }
    </style>
</head>
<body>

    <!-- Splash Screen -->
    <div class="splash-screen" id="splash">
        <div class="text-center">
            <h1 class="splash-text text-center">Study Planner & Tracker</h1>
            <button id="enterLoginBtn" class="app-btn-primary mt-4" style="width: auto; padding: 0.8rem 2.5rem; border-radius: 50px; font-size: 1.1rem; transform: scale(0.9); opacity: 0; animation: fadeIn 0.8s ease-out 1s forwards;">
                Login <i class="fas fa-arrow-right ms-2"></i>
            </button>
        </div>
    </div>

    <!-- Login Form -->
    <div class="glass-panel text-center">
        <h2 style="font-weight: 700; margin-bottom: 2rem;">Welcome Back 👋</h2>
        
        {% if form.errors %}
            <p style="color: #ef4444; font-size: 0.9rem; margin-bottom: 1rem;">Your username and password didn't match. Please try again.</p>
        {% endif %}

        <form method="post" action="{% url 'login' %}">
            {% csrf_token %}
            <div class="text-start">
                <label style="color: #cbd5e1; font-size: 0.875rem; margin-bottom: 0.5rem; display: block;">Username</label>
                <input type="text" name="username" class="app-form-control" placeholder="Enter username" required autofocus>
            </div>
            
            <div class="text-start">
                <label style="color: #cbd5e1; font-size: 0.875rem; margin-bottom: 0.5rem; display: block;">Password</label>
                <input type="password" name="password" class="app-form-control" placeholder="Enter password" required>
            </div>

            <button type="submit" class="app-btn-primary mt-3">Log In</button>
            <input type="hidden" name="next" value="{{ next }}">
        </form>
    </div>

    <script>
        document.getElementById('enterLoginBtn').addEventListener('click', () => {
            document.body.classList.add('loaded');
        });
    </script>
</body>
</html>

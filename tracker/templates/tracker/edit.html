<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Task - Planora</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #fcf4f6;
            --text-dark: #584a69;
            --text-muted: #9487a3;
            --accent-blue: #7c5c96;
            --card-bg: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
        }

        .container {
            width: 100%;
            max-width: 500px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 2.5rem 2rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
        }

        .header-title {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: #0f172a;
            text-align: center;
        }

        .header-subtitle {
            font-size: 1rem;
            color: var(--text-muted);
            margin-bottom: 2rem;
            font-weight: 400;
            text-align: center;
        }

        .app-form-group {
            margin-bottom: 1.25rem;
        }

        .app-form-group label {
            display: block;
            font-size: 0.875rem;
            color: var(--text-dark);
            margin-bottom: 0.5rem;
            font-weight: 500;
        }

        .app-form-control {
            width: 100%;
            padding: 0.875rem 1rem;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            color: var(--text-dark);
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .app-form-control:focus {
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .actions {
            display: flex;
            gap: 1rem;
            margin-top: 2rem;
        }

        .app-btn-primary {
            flex: 1;
            padding: 1rem;
            background: var(--accent-blue);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .app-btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(37, 99, 235, 0.3);
        }

        .app-btn-secondary {
            flex: 1;
            padding: 1rem;
            background: #f1f5f9;
            color: var(--text-dark);
            text-decoration: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            text-align: center;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            border: 1px solid #e2e8f0;
        }

        .app-btn-secondary:hover {
            background: #e2e8f0;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="card">
            <h1 class="header-title">Edit Task</h1>
            <p class="header-subtitle">Update your study plan</p>

            <form action="{% url 'edit_task' task.id %}" method="POST">
                {% csrf_token %}
                <div class="app-form-group">
                    <label for="title">Title</label>
                    <input type="text" id="title" name="title" class="app-form-control" value="{{ task.title }}" required>
                </div>
                
                <div class="app-form-group">
                    <label for="subject">Subject</label>
                    <input type="text" id="subject" name="subject" class="app-form-control" value="{{ task.subject }}" required>
                </div>

                <div class="app-form-group">
                    <label for="study_date">Date</label>
                    <input type="date" id="study_date" name="study_date" class="app-form-control" value="{{ task.study_date|date:'Y-m-d' }}" required>
                </div>

                <div class="app-form-group">
                    <label for="duration">Duration (mins)</label>
                    <input type="number" id="duration" name="duration" class="app-form-control" value="{{ task.duration }}" min="1" required>
                </div>

                <div class="actions">
                    <a href="{% url 'home' %}" class="app-btn-secondary">
                        <i class="fas fa-times"></i> Cancel
                    </a>
                    <button type="submit" class="app-btn-primary">
                        <i class="fas fa-check"></i> Save
                    </button>
                </div>
            </form>
        </div>
    </div>

</body>
</html>
